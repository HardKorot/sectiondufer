<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion - Justice d'Iwa</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="auth-main">
<section class="login-card panel">
  <p class="kicker">ACCÈS RESTREINT</p>
  <h2>Administration</h2>
  <form id="loginForm">
    <label>Identifiant
      <input id="username" required autocomplete="username" placeholder="Votre identifiant">
    </label>
    <label>Mot de passe
      <div class="password-wrap">
        <input id="password" type="password" required autocomplete="current-password">
        <button type="button" class="password-toggle" data-target="password">Afficher</button>
      </div>
    </label>
    <button class="primary full" type="submit">Se connecter</button>
  </form>
  <div id="loginMessage" class="message hidden"></div>
  <p class="tiny">Pour ton ancien compte, tu peux encore saisir ton adresse e-mail complète.</p>
</section>
</main>

<script src="config.js?v=clean3"></script>
<script src="login.js?v=clean3"></script>
</body>
</html>

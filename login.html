<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justice d'Iwa - Connexion</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">岩</div>
    <div><h1>IWA</h1><p>ACCÈS JUSTICE</p></div>
  </div>
  <a class="nav-btn" href="index.html">Retour</a>
</header>

<main class="auth-main">
  <section class="login-card stone-panel">
    <p class="kicker">ACCÈS RESTREINT</p>
    <h2>Administration judiciaire</h2>
    <p class="muted">Connexion réservée aux membres autorisés de la justice d'Iwa.</p>

    <form id="loginForm">
      <label>Identifiant
        <input id="username" type="text" required autocomplete="username" placeholder="Ex. kaji">
      </label>
      <label>Mot de passe
        <input id="password" type="password" required autocomplete="current-password">
      </label>
      <button class="primary full" type="submit">Se connecter</button>
    </form>

    <div id="loginMessage" class="message hidden"></div>
  </section>
</main>

<script src="config.js?v=usernames-1"></script>
<script src="login.js?v=usernames-1"></script>
</body>
</html>

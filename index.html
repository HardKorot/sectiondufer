<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Justice d'Iwa</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">岩</div><div><h1>IWA</h1><p>PORTAIL JUDICIAIRE</p></div></div>
  <a class="nav-btn" href="login.html">Administration</a>
</header>

<main>
<section class="hero">
  <p class="kicker">JUSTICE DU VILLAGE CACHÉ DE LA ROCHE</p>
  <h2>Déposer une plainte</h2>
  <p class="intro">Votre plainte sera transmise aux autorités judiciaires d'Iwa.</p>
</section>

<section class="panel">
<form id="complaintForm">
  <div class="grid">
    <label>Plaignant<input id="plaignant" required></label>
    <label>Accusé<input id="accuse" required></label>
  </div>
  <div class="grid">
    <label>Motif
      <select id="motif" required>
        <option value="">Choisir...</option>
        <option>Agression</option><option>Vol</option><option>Menaces</option>
        <option>Escroquerie</option><option>Meurtre</option><option>Dégradation</option>
        <option>Trouble à l'ordre public</option><option>Autre</option>
      </select>
    </label>
    <label>Lieu<input id="lieu" required></label>
  </div>
  <div class="grid">
    <label>Date des faits<input id="dateFaits" type="date" required></label>
    <label>Témoins<input id="temoins"></label>
  </div>
  <label>Description<textarea id="description" rows="7" required></textarea></label>
  <button class="primary" type="submit">Transmettre la plainte</button>
</form>
<div id="successBox" class="message hidden"></div>
<div id="errorBox" class="message hidden"></div>
</section>
</main>

<script src="config.js?v=clean3"></script>
<script src="public.js?v=clean3"></script>
</body>
</html>

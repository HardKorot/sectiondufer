<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion des utilisateurs - Justice d'Iwa</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="loadingGuard" class="screen-loader">Vérification de l'accès...</div>

<div id="usersApp" class="hidden">
<header class="topbar">
  <div class="brand">
    <div class="logo">岩</div>
    <div><h1>IWA</h1><p>GESTION DES UTILISATEURS</p></div>
  </div>
  <div class="nav-actions">
    <span id="adminName" class="admin-email"></span>
    <a href="admin.html" class="nav-btn">Dossiers</a>
    <button id="logoutBtn" class="nav-btn">Déconnexion</button>
  </div>
</header>

<main>
<section class="hero admin-hero">
  <p class="kicker">SUPER ADMINISTRATION</p>
  <h2>Gestion des utilisateurs</h2>
  <p class="intro">Créer, modifier ou supprimer les comptes d'accès à l'administration.</p>
</section>

<section class="panel">
  <h3>Créer un utilisateur</h3>
  <form id="createAccountForm">
    <div class="grid">
      <label>Identifiant
        <input id="newUsername" required minlength="3" maxlength="30" placeholder="Nouvel identifiant">
      </label>
      <label>Mot de passe
        <div class="password-wrap">
          <input id="newPassword" type="password" required minlength="8">
          <button type="button" class="password-toggle" data-target="newPassword">Afficher</button>
        </div>
      </label>
    </div>

    <label>Confirmation
      <div class="password-wrap">
        <input id="confirmPassword" type="password" required minlength="8">
        <button type="button" class="password-toggle" data-target="confirmPassword">Afficher</button>
      </div>
    </label>

    <button class="primary" type="submit">Créer le compte</button>
  </form>

  <div id="accountMessage" class="message hidden"></div>
</section>

<section class="panel">
  <div class="modal-head users-heading">
    <div>
      <p class="kicker">COMPTES</p>
      <h3>Utilisateurs existants</h3>
    </div>
    <button id="reloadUsersBtn" class="secondary" type="button">Actualiser</button>
  </div>

  <div id="usersList" class="users-list">
    <div class="empty">Chargement...</div>
  </div>
</section>
</main>
</div>

<script src="config.js?v=clean4"></script>
<script src="users.js?v=clean4"></script>
</body>
</html>
